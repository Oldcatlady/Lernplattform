<!doctype html>
<!-- DOKU: Quizseite für Richtig/Falsch (RF), trotz des allgemeinen Dateinamens. Geladene Aussagen werden bewertet und als Antwortänderungen an private-sync.js übergeben. -->

<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Richtig oder Falsch – Lernhub</title>
<style>
/* DOKU: Die eingebetteten Styles legen Seitenlayout, Theme-Farben und Zustände der Bedienelemente fest. CSS-Klassen wie hidden, correct oder wrong werden vom Seitenskript gesetzt; sie übernehmen keine Zugriffsprüfung. */
/* ================================================================
   THEME-FARBEN: Diese drei Blöcke bestimmen das Aussehen des Quiz.
   Die Farben orientieren sich an der Theme-Auswahl im Dashboard.
   ================================================================ */
* { box-sizing: border-box; }
body {
  --page:#2a1b3d; --surface:#e68bc3; --question-bg:#ffc1de;
  --ink:#3b1550; --muted:#451b4a; --accent:#ba357e;
  --edge:#f554aa; --question-ink:#27122a;
  margin:0; min-height:100vh; color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(circle at 85% 6%,#764274,transparent 34%),var(--page);
}
body.theme-himalaya {
  --page:#24748d; --surface:#6db7e1; --question-bg:#bfdfef;
  --ink:#173b45; --muted:#0d3a4d; --accent:#187d91;
  --edge:#102354; --question-ink:#081a40;
  background:radial-gradient(circle at 85% 6%,#7dbdc9,transparent 35%),var(--page);
}
body.theme-dschungel {
  --page:#0d1b12; --surface:#288029; --question-bg:#76c57e;
  --ink:#04320e; --muted:#71d45d; --accent:#f49b58;
  --edge:#0b6d34; --question-ink:#30270c;
  background:radial-gradient(circle at 85% 6%,#284b31,transparent 35%),var(--page);
}
.hidden { display:none !important; }
.workspace { width:min(100% - 2rem,760px); margin:1.25rem auto 3rem; }

/* OBERE LEISTE: Nur ein kleiner Zurück-Button, außerhalb der Quizbox. */
.toolbar { display:flex; justify-content:flex-end; min-height:56px; align-items:center; }
.exit {
  display:inline-flex; align-items:center; justify-content:center;
  min-height:44px; padding:.6rem 1.3rem; border-radius:999px;
  border:2px solid var(--edge); background:var(--surface);
  color:var(--ink); text-decoration:none; font-weight:650;
}
.exit:hover,.exit:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

/* QUIZBOX: Thema und Fortschritt stehen sichtbar im oberen Bereich. */

main {
  padding:clamp(1.1rem,4vw,2rem); border:2px solid var(--edge);
  border-radius:26px; background:var(--surface); box-shadow:0 20px 55px #0003;
}
h1 { margin:0; font-size:clamp(1.45rem,3vw,2rem); line-height:1.2; }
.context { margin:.35rem 0 1.3rem; color:var(--muted); font-size:.95rem; }
.progress-row { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; font-weight:700; }
.progress-row p { margin:0 0 .5rem; }
.score { display:flex; gap:.5rem; align-items:center; font-variant-numeric:tabular-nums; }
.score .correct-count { color:#0ca04c; }
.score .wrong-count { color:#d51a3f; }
body.theme-dschungel .score .correct-count { color:#54e872; }
body.theme-dschungel .score .wrong-count { color:#ff5c5c; }
.score .separator { opacity:.75; }
progress { display:block; width:100%; height:1.8rem; accent-color:var(--accent); }
progress::-webkit-progress-bar { background:var(--question-bg); border-radius:999px; }
progress::-webkit-progress-value { background:var(--accent); border-radius:999px; }
progress::-moz-progress-bar { background:var(--accent); border-radius:999px; }
#status { margin:1rem 0; color:var(--muted); }
#status.error { color:#de254a; font-weight:650; }
body.theme-dschungel #status.error { color:#ff9696; }

/* FRAGE: Der farbige Kasten trennt die Aussage vom übrigen Quiz. */
.statement-box {
  display:grid; place-items:center; width:100%; min-height:clamp(190px,31vw,280px);
  margin:1.35rem 0 1.15rem; padding:clamp(1.35rem,4vw,2.5rem);
  border:3px solid var(--edge); border-radius:22px;
  background:var(--question-bg); color:var(--question-ink);
  box-shadow:0 9px 24px #0002;
}
#statement { margin:0; text-align:center; font-family:Georgia,"Times New Roman",serif; font-size:clamp(1.2rem,2.8vw,1.65rem); font-weight:650; line-height:1.5; overflow-wrap:anywhere; }

/* ANTWORT UND ERKLÄRUNG: Erscheinen nach der Auswahl. */
button { font:inherit; cursor:pointer; min-height:48px; border-radius:14px; }
button:disabled { opacity:.62; cursor:not-allowed; }
.options { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
.options button {
  padding:.85rem 1rem; border:2px solid var(--edge);
  background:var(--question-bg); color:var(--question-ink); font-size:1.08rem; font-weight:650;
}
.options button.correct { border-color:#09af56; background:#d7f2e2; color:#1b6539; }
.options button.wrong { border-color:#ce2e39; background:#fbe2e2; color:#912226; }
.primary {
  width:100%; margin-top:1.2rem; padding:.85rem 1rem;
  background:var(--accent); border:2px solid var(--accent); color:#918e8e; font-weight:700;
}
body.theme-dschungel .primary { color:#21412a; }
.explanation { padding:1rem 1.2rem; border-radius:14px; background:var(--question-bg); color:var(--question-ink); margin-top:1rem; line-height:1.6; }
#verdict { font-weight:700; margin:1.1rem 0 .4rem; }
.result-actions { display:flex; gap:1rem; align-items:center; margin-top:1.4rem; }
.result-actions .primary { width:auto; flex:1; margin:0; }
@media(max-width:500px) {
  .workspace { width:min(100% - 1rem,760px); margin-top:.5rem; }
  .options { gap:.55rem; }
  .result-actions { flex-direction:column; align-items:stretch; }
}

/* Kompakte Ergebnisansicht: Note zuerst, keine Fragenliste. */
#result { text-align:center; }
#result h2 { font-size:1.15rem; margin:.5rem 0; }
#result .grade-label { margin:.8rem 0 0; font-size:1rem; }
#grade { display:block; font-size:clamp(3.5rem,14vw,5rem); font-weight:800; line-height:1.1; }
#summary { margin:.7rem 0; font-size:1.1rem; font-weight:650; }
#result .result-actions { margin-top:1rem; gap:.65rem; }
#result .result-actions .primary { width:auto; flex:initial; margin:0; padding:.65rem 1rem; }
#result .result-actions { justify-content:center; }
</style>
<link rel="stylesheet" href="theme-forest.css">
</head>
<body class="theme-einhorn">
<div class="workspace">
  <!-- NAVIGATION: Zurück verlässt das Quiz; Statistik wird hier nicht gezeigt. -->
  <div class="toolbar"><a class="exit" href="quizBit.html">Zurück</a></div>
  <main>
    <!-- THEMA: steht als Überschrift, die Auswahl darunter als Kontext. -->
    <h1 id="topic-title">Thema</h1>
    <p id="context" class="context"></p>
    <p id="status" role="status">Fragen werden geladen …</p>

    <section id="play" class="hidden" aria-label="Richtig oder Falsch">
      <!-- FORTSCHRITT: links Gesamtzahl, rechts richtig | falsch. -->
      <div class="progress-row">
        <p id="progress-label"></p>
        <p id="score" class="score" aria-label="0 richtig, 0 falsch">
          <span id="correct-count" class="correct-count">0</span>
          <span class="separator" aria-hidden="true">|</span>
          <span id="wrong-count" class="wrong-count">0</span>
        </p>
      </div>
      <progress id="progress" value="0" max="1" aria-label="Beantwortete Fragen"></progress>

      <!-- FRAGE: Die Aussage ist der Mittelpunkt der Seite. -->
      <div class="statement-box"><p id="statement"></p></div>
      <div id="options" class="options">
        <button type="button" data-answer="true">Richtig</button>
        <button type="button" data-answer="false">Falsch</button>
      </div>
      <p id="verdict" role="status" class="hidden"></p>
      <div id="explanation" class="explanation hidden"></div>
      <button id="next" type="button" class="primary hidden">Weiter</button>
    </section>

    <!-- ABSCHLUSS: Punktzahl, noch einmal spielen oder Quiz beenden. -->
    <section id="result" class="hidden">
      <h2>Ergebnis</h2><p class="grade-label">Deine Note<strong id="grade"></strong></p><p id="summary"></p>
      <div class="result-actions">
        <button id="restart" type="button" class="primary">Neu mischen und nochmal spielen</button>
        <a href="quizBit.html" class="exit">Beenden</a>
      </div>
    </section>
  </main>
</div>
<script type="module">
import { matchesFilters, selectionLabel } from "./quiz-data-core.js";
/* ================================================================
   1. FIREBASE: Anmeldung, Fragen und persönlicher Lernstand
   Die Firebase-Einstellungen kommen aus firebase-config.js.
   ================================================================ */
import {queueAnswer} from './private-sync.js';
import {onAuthStateChanged,signOut} from './private-auth.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import { getAuth } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import { getFirestore } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
import { firebaseConfig } from './firebase-config.js';
import { loadRoundQuestions, clearDataCache, readQuizSelection } from './quiz-data.js';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

/* ================================================================
   2. AUSWAHL: Theme, Thema und Filter kommen vom Dashboard.
   Hier steht statt "Richtig oder Falsch" der Name des Themas.
   ================================================================ */
const theme = localStorage.getItem('lernhubTheme');
if (['theme-einhorn', 'theme-himalaya', 'theme-dschungel'].includes(theme)) {
    document.body.className = theme;
}
const selection = readQuizSelection();
const validSelection = selection?.quizType === 'RF' && selection.semester && selection.subject && selection.topic;
if (validSelection) {
    $('topic-title').textContent = selectionLabel(selection.topic, 'topic');
    const semester = selectionLabel(selection.semester, 'semester');
    const subject = selectionLabel(selection.subject, 'subject');
    $('context').textContent = `${semester} · ${subject}`;
} else {
    $('status').textContent = 'Bitte wähle zuerst Semester, Fach, Thema und „Richtig oder Falsch“ im Dashboard.';
    $('status').classList.add('error');
}

/* ================================================================
   3. FRAGEN: Deutsche und bisherige englische Firestore-Felder lesen.
   "Korrekte-Antwort" hat bei RF nur "Richtig" oder "Falsch".
   ================================================================ */
let user = null;
let all = [];        // Fragen der gewählten Auswahl.
let round = [];      // Fragen in diesem Durchlauf.
let index = 0;
let correct = 0;
let wrong = 0;
let answered = false;

/* DOKU: Überführt die geladenen Felder in das Seitenformat. ID und Pfad bleiben für das Speichern des Lernstands erhalten; das Originalobjekt wird nicht verändert. */
function normalize(raw) {
    const answer = raw['Korrekte-Antwort'];
    return {
        id: raw.id, path: raw.path,
        semester: raw.semester ?? String(raw.Semester ?? '').replace(/^Semester\s+/i, ''),
        subject: raw.subject ?? raw.Fach,
        topic: raw.topic ?? raw.Thema,
        quizType: raw['Quiz-Möglichkeit'] ?? raw.quizType,
        statement: raw.Frage ?? raw.statement,
        isTrue: typeof raw.isTrue === 'boolean' ? raw.isTrue :
            answer === 'Richtig' ? true : answer === 'Falsch' ? false : null,
        explanation: raw['Erklärung'] ?? raw.explanation
    };
}

/* DOKU: Prüft RF-Kennung, Filter und die normalisierte boolesche Lösung samt Aussage und Erklärung. */
function matchesSelection(question) {
    return question.quizType === 'RF' &&
        matchesFilters(question, selection) &&
        typeof question.isTrue === 'boolean' &&
        typeof question.statement === 'string' &&
        typeof question.explanation === 'string';
}

/* DOKU: Mischt eine Array-Kopie mit Fisher-Yates. Die Ausgangsliste bleibt erhalten; ein Neustart mischt die bereits gebildete Runde erneut. */
function shuffle(items) {
    const result = [...items];
    for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
}

/* DOKU: Zeigt einen Fehlertext im Statusbereich und hebt ihn über CSS hervor; verändert keine gespeicherten Antworten. */
function showError(message) {
    $('status').textContent = message;
    $('status').classList.remove('hidden');
    $('status').classList.add('error');
}

/* ================================================================
   4. ANZEIGE: Anzahl, grüner und roter Zähler, Aussage und Buttons.
   Die sichtbaren Wörter "Fragen:" und "Weiter" stehen hier bzw.
   im HTML. Der Themenname kommt aus dem Dashboard.
   ================================================================ */
/* DOKU: Überträgt die laufenden Richtig/Falsch-Zähler in Anzeige und barrierefreie Beschriftung. Die dauerhafte Speicherung erfolgt separat. */
function updateScore() {
    $('correct-count').textContent = correct;
    $('wrong-count').textContent = wrong;
    $('score').setAttribute('aria-label', `${correct} richtig, ${wrong} falsch`);
}

/* DOKU: Setzt Antwortsperre und Hervorhebungen zurück, zeigt die aktuelle Aussage und bereitet beide RF-Schaltflächen vor. */
function display() {
    const question = round[index];
    answered = false;
    $('progress-label').textContent = `Fragen: ${round.length}`;
    $('progress').max = round.length;
    $('progress').value = index;
    updateScore();
    $('statement').textContent = question.statement;
    $('verdict').classList.add('hidden');
    $('explanation').classList.add('hidden');
    $('next').classList.add('hidden');
    document.querySelectorAll('#options button').forEach(button => {
        button.disabled = false;
        button.classList.remove('correct', 'wrong');
    });
    $('status').classList.add('hidden');
    $('status').classList.remove('error');
}

/* DOKU: Setzt den Durchlauf zurück. Beim ersten Start wird die geladene Auswahl begrenzt; all umgeht die sonstige Grenze von 40. Bei Neustarts wird die bestehende Runde neu gemischt. */
function start() {
    // "Alle verfügbaren" kann mehr als 40 Fragen enthalten.
    const count = selection.questionCount === 'all'
        ? all.length
        : Math.min(selection.questionCount || 15, 40, all.length);
    round = round.length ? shuffle(round) : shuffle(all).slice(0, count);
    index = correct = wrong = 0;
    $('result').classList.add('hidden');
    $('play').classList.remove('hidden');
            window.scrollTo({top:0,left:0,behavior:'instant'});
    display();
}

/* ================================================================
   5. FRAGEN LADEN: Semester, Fach, Thema und Lernstand-Auswahl.
   questionIds enthält die zuvor im Dashboard gewählten Fragen.
   ================================================================ */
/* DOKU: Lädt die Fragen erst für das freigegebene Konto. Die UID-Prüfung kommt aus private-auth.js; Firestore muss Zugriffe zusätzlich serverseitig erlauben. queueAnswer sichert Antworten lokal vor dem zeitversetzten Cloud-Abgleich. */
onAuthStateChanged(auth, async current => {
    if (!current) {
        clearDataCache();
        location.replace('login.html');
        return;
    }
    if (user?.uid === current.uid) return;
    user = current;
    if (!validSelection) return;
    try {
        const questions = await loadRoundQuestions(db, user.uid, selection);
        all = questions.map(normalize).filter(matchesSelection);
        if (!all.length) {
            showError('Für diese Auswahl sind noch keine RF-Aussagen gespeichert.');
            return;
        }
        start();
    } catch (error) {
        console.error(error);
        showError('Fragen konnten nicht geladen werden. Prüfe Anmeldung, Firestore-Regeln und Internetverbindung.');
    }
});

/* ================================================================
   6. ANTWORT SPEICHERN UND AUSWERTEN
   Ein exakter Treffer zählt 1 Punkt. Danach erscheint die Erklärung.
   ================================================================ */
document.querySelectorAll('#options button').forEach(button => {
    button.addEventListener('click', async () => {
        if (answered || !user) return;
        answered = true;
        const question = round[index];
        const chosen = button.dataset.answer === 'true';
        const isCorrect = chosen === question.isTrue;
        document.querySelectorAll('#options button').forEach(option => option.disabled = true);
        $('status').textContent = 'Antwort wird gesichert …';

        try {
            // Statistik wird ausschließlich beim eigenen Benutzer gespeichert.
            await queueAnswer(db, user.uid, question, {isCorrect, type: 'RF'});

            if (isCorrect) correct++;
            else wrong++;
            updateScore();
            document.querySelectorAll('#options button').forEach(option => {
                if ((option.dataset.answer === 'true') === question.isTrue) {
                    option.classList.add('correct');
                }
            });
            if (!isCorrect) button.classList.add('wrong');
            $('verdict').textContent = isCorrect
                ? 'Richtig beantwortet.'
                : `Leider falsch. Die Aussage ist ${question.isTrue ? 'richtig' : 'falsch'}.`;
            $('verdict').classList.remove('hidden');
            $('explanation').textContent = question.explanation;
            $('explanation').classList.remove('hidden');
            $('progress').value = index + 1;
            $('next').classList.remove('hidden');
            $('status').textContent = 'Antwort gesichert.';
            $('status').classList.add('hidden');
        } catch (error) {
            console.error(error);
            answered = false;
            document.querySelectorAll('#options button').forEach(option => option.disabled = false);
            showError('Speichern fehlgeschlagen. Bitte prüfe Verbindung und versuche die Antwort erneut.');
        }
    });
});

/* ================================================================
   7. WEITER, ERGEBNIS UND NEU MISCHEN
   Die Berechnung der Note bleibt unverändert.
   ================================================================ */
$('next').addEventListener('click', () => {
    if (!answered) return;
    index++;
    if (index < round.length) {
        display();
        return;
    }
    const percent = Math.round(correct / round.length * 100);
    const grade = percent >= 92 ? 1 : percent >= 81 ? 2 : percent >= 67 ? 3 :
        percent >= 50 ? 4 : percent >= 30 ? 5 : 6;
    $('grade').textContent = grade;
    $('summary').textContent = `${correct} richtig, ${wrong} falsch`;
    $('play').classList.add('hidden');
    $('result').classList.remove('hidden');
                window.scrollTo({top:0,left:0,behavior:'instant'});
    $('status').textContent = 'Quiz abgeschlossen.';
    $('status').classList.add('hidden');
});
$('restart').addEventListener('click', start);
</script>
</body>
</html>
