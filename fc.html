<!doctype html>
<!-- DOKU: Flashcard-Runde ohne Punkte. Das erste Aufdecken pro Karte und Durchlauf erhöht timesViewed; wiederholtes Umdrehen innerhalb derselben Runde zählt nicht erneut. -->

<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flashcards – FIAE Trainer</title>
    <style>
/* DOKU: Die eingebetteten Styles legen Seitenlayout, Theme-Farben und Zustände der Bedienelemente fest. CSS-Klassen wie hidden, correct oder wrong werden vom Seitenskript gesetzt; sie übernehmen keine Zugriffsprüfung. */
        /* ==========================================================
           GRUNDLAYOUT UND THEME-FARBEN
           Die drei body.theme-...-Blöcke passen zur Theme-Auswahl
           im Dashboard. Karten-Vorderseite und Rückseite besitzen
           bewusst unterschiedliche Farben.
           ========================================================== */
        * { box-sizing: border-box; }
        body {
            --page: #2a1b3d;
            --surface: #f9e9f3;
            --front: #f8bedf;
            --back: #ffdcaf;
            --ink: #3b1550;
            --muted: #69416e;
            --accent: #ba357e;
            --edge: #d987b3;
            --card-ink: #321b36;
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at 85% 6%, #764274, transparent 34%), var(--page);
        }
        body.theme-himalaya {
            --page: #24748d;
            --surface: #e9f5fc;
            --front: #bfdfef;
            --back: #d7d1f1;
            --ink: #173b45;
            --muted: #416574;
            --accent: #187d91;
            --edge: #70b4c5;
            --card-ink: #153947;
            background: radial-gradient(circle at 85% 6%, #7dbdc9, transparent 35%), var(--page);
        }
        body.theme-dschungel {
            --page: #0d1b12;
            --surface: #193323;
            --front: #315b36;
            --back: #655838;
            --ink: #edfae7;
            --muted: #b8d7b2;
            --accent: #f49b58;
            --edge: #628961;
            --card-ink: #fff9e9;
            background: radial-gradient(circle at 85% 6%, #284b31, transparent 35%), var(--page);
        }
        button, input { font: inherit; }
        button { cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: .5; }
        .hidden { display: none !important; }

        /* ==========================================================
           OBERE LEISTE
           "Zurück" beendet die Flashcards. Der Schieberegler steht
           bewusst über der Quizbox und steuert nur die Karten-Schrift.
           ========================================================== */
        .workspace { width: min(100% - 2rem, 760px); margin: 1.25rem auto 3rem; }
        .toolbar { display: flex; align-items: center; justify-content: flex-end; min-height: 56px; }
        .exit {
            display: inline-flex; align-items: center; justify-content: center;
            min-height: 44px; padding: .6rem 1.3rem; border-radius: 999px;
            border: 2px solid var(--edge); background: var(--surface);
            color: var(--ink); text-decoration: none; font-weight: 650;
        }
        .exit:hover, .exit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .size-control {
            display: flex; align-items: center; gap: 1rem;
            width: min(100%, 370px); margin: .65rem 0 1.1rem auto;
            color: #fff; font-weight: 650;
        }
        .size-control input { width: 100%; accent-color: var(--accent); }

        /* ==========================================================
           QUIZBOX: Thema, Anzahl und Fortschritt
           ========================================================== */
        main {
            padding: clamp(1.1rem, 4vw, 2rem);
            border: 2px solid var(--edge); border-radius: 26px;
            background: var(--surface);
            box-shadow: 0 20px 55px #0003;
        }
        h1 { margin: 0; font-size: clamp(1.45rem, 3vw, 2rem); line-height: 1.2; }
        .context { margin: .35rem 0 1.3rem; color: var(--muted); font-size: .95rem; }
        .meta { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; font-weight: 650; }
        .meta p { margin: 0 0 .4rem; }
        progress { display: block; width: 100%; height: 1.15rem; accent-color: var(--accent); }
        progress::-webkit-progress-bar { background: var(--front); border-radius: 999px; }
        progress::-webkit-progress-value { background: var(--accent); border-radius: 999px; }
        progress::-moz-progress-bar { background: var(--accent); border-radius: 999px; }
        #status { margin: 1rem 0; color: var(--muted); }
        #status.error { color: #b42535; font-weight: 650; }

        /* ==========================================================
           KARTE
           Schriftgröße: --card-size wird vom Regler in JavaScript gesetzt.
           "Klick" und "Antwort" sind kleine Orientierungshilfen;
           der eigentliche Text steht mittig in einer Serifenschrift.
           ========================================================== */
        .card {
            position: relative; display: grid; place-items: center;
            width: 100%; min-height: clamp(270px, 42vw, 380px);
            margin-top: 1.2rem; padding: 3.4rem clamp(1.3rem, 4vw, 2.5rem);
            border: 2px solid var(--edge); border-radius: 22px;
            background: var(--front); color: var(--card-ink);
            text-align: center; line-height: 1.5;
            font-family: Georgia, "Times New Roman", serif;
            font-size: var(--card-size, 1.5rem);
            box-shadow: 0 9px 24px #0002;
        }
        .card.is-back { background: var(--back); }
        .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
        .card-label {
            position: absolute; top: 1rem; left: 1.25rem;
            font: 600 .78rem system-ui, sans-serif;
            letter-spacing: .06em; text-transform: uppercase; opacity: .8;
        }
        .card.is-back .card-label { left: auto; right: 1.25rem; }
        .card-content { width: 100%; overflow-wrap: anywhere; }
        .card-content p { margin: .35rem 0; }
        .card-content p + p { margin-top: 1rem; }
        .controls { display: flex; gap: .85rem; margin-top: 1.25rem; }
        .controls button, .result-actions button {
            flex: 1; min-height: 48px; padding: .7rem 1rem;
            border: 2px solid var(--edge); border-radius: 14px;
            background: var(--front); color: var(--card-ink); font-weight: 650;
        }
        .controls .primary, .result-actions .primary {
            background: var(--accent); border-color: var(--accent); color: #fff;
        }
        body.theme-dschungel .controls .primary,
        body.theme-dschungel .result-actions .primary { color: #17251b; }
        .result-actions { display: flex; gap: .85rem; margin-top: 1.5rem; }
        @media (max-width: 510px) {
            .workspace { width: min(100% - 1rem, 760px); margin-top: .5rem; }
            .size-control { margin-top: .3rem; }
            .result-actions { flex-direction: column; }
        }
    
/* Kompakte Ergebnisansicht: Note zuerst, keine Fragenliste. */
#result { text-align:center; }
#result h2 { font-size:1.15rem; margin:.5rem 0; }
#result .grade-label { margin:.8rem 0 0; font-size:1rem; }
#grade { display:block; font-size:clamp(3.5rem,14vw,5rem); font-weight:800; line-height:1.1; }
#summary { margin:.7rem 0; font-size:1.1rem; font-weight:650; }
#result .result-actions { margin-top:1rem; gap:.65rem; }
#result .result-actions .primary { width:auto; flex:initial; margin:0; padding:.65rem 1rem; }
#result .result-actions { justify-content:center; }
</style>
<link rel="stylesheet" href="theme-forest.css">
</head>
<body class="theme-einhorn">
    <div class="workspace">
        <!-- OBERE LEISTE: Dieser Button beendet den Durchlauf. -->
        <div class="toolbar"><a class="exit" href="quizBit.html">Zurück</a></div>

        <!-- SCHRIFTGRÖSSE: absichtlich außerhalb der Quizbox. -->
        <label class="size-control" for="font-size">
            Schriftgröße
            <input type="range" id="font-size" min="1" max="5" step="1" value="3">
        </label>

        <main>
            <!-- THEMA: wird aus der Auswahl im Dashboard gefüllt. -->
            <h1 id="topic-title">Flashcards</h1>
            <p id="context" class="context"></p>
            <p id="status" role="status">Karten werden geladen …</p>

            <!-- DURCHLAUF: Anzahl, dicker Fortschrittsbalken, Zähler. -->
            <section id="play" class="hidden" aria-label="Flashcards">
                <div class="meta"><p id="total"></p><p id="count"></p></div>
                <progress id="progress" value="0" max="1" aria-label="Gelernte Karten"></progress>
                <button id="card" type="button" class="card">
                    <span id="card-side" class="card-label"></span>
                    <span id="card-content" class="card-content"></span>
                </button>
                <div class="controls">
                    <button id="previous" type="button">Vorherige</button>
                    <button id="next" type="button" class="primary" disabled>Weiter</button>
                </div>
            </section>

            <!-- ENDE: Thema steht als Überschrift oben, hier nur die Anzahl. -->
            <section id="result" class="hidden">
                <p id="summary"></p>
                <div class="result-actions">
                    <button id="restart" type="button" class="primary">Mischen und nochmal ansehen</button>
                    <a class="exit" href="quizBit.html">Beenden</a>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
import { matchesFilters, selectionLabel } from "./quiz-data-core.js";
        // ============================================================
        // FIREBASE UND AUSWAHL AUS DEM DASHBOARD
        // Die Datenbankfelder werden unten in normalize() vereinheitlicht.
        // ============================================================
        import {queueAnswer} from './private-sync.js';
import {onAuthStateChanged,signOut} from './private-auth.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
        import { firebaseConfig } from './firebase-config.js';
import { loadRoundQuestions, clearDataCache, readQuizSelection } from './quiz-data.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const $ = id => document.getElementById(id);
        const validThemes = ['theme-einhorn', 'theme-himalaya', 'theme-dschungel'];
        const savedTheme = localStorage.getItem('lernhubTheme');
        if (validThemes.includes(savedTheme)) document.body.className = savedTheme;

        const selection = readQuizSelection();
        const validSelection = selection?.quizType === 'FC' && selection.semester && selection.subject && selection.topic;
        if (validSelection) {
            // Überschrift: Hier steht das gewählte Thema anstelle von "Flashcards".
            $('topic-title').textContent = selectionLabel(selection.topic, 'topic');
            const semesterLabel = selectionLabel(selection.semester, 'semester');
            const subjectLabel = selectionLabel(selection.subject, 'subject');
            $('context').textContent = `${semesterLabel} · ${subjectLabel}`;
        } else {
            $('status').textContent = 'Wähle zuerst Flashcards, Semester, Fach und Thema im Dashboard.';
            $('status').classList.add('error');
        }

        // ============================================================
        // DATEN AUS FIRESTORE
        // Unterstützt die vorhandenen MC/FC-Felder und deutsche Feldnamen.
        // Die Antworttexte kommen aus A–D, aber Buchstaben werden auf der
        // Kartenrückseite nicht angezeigt.
        // ============================================================
        let user = null;
        let all = [];
        let round = [];
        let index = 0;
        let flipped = false;
        let busy = false;
        let completed = new Set();
        const letters = ['A', 'B', 'C', 'D'];

        /* DOKU: Liest Quiztypen aus alternativen Feldnamen; kommagetrennter Text wird in eine Liste umgewandelt. */
function modes(q) {
            const raw = q.quizTypes ?? q.quizType ?? q['Quiz-Möglichkeit'] ?? '';
            return Array.isArray(raw) ? raw : String(raw).split(',').map(value => value.trim());
        }

        /* DOKU: Überführt die geladenen Felder in das Seitenformat. ID und Pfad bleiben für das Speichern des Lernstands erhalten; das Originalobjekt wird nicht verändert. */
function normalize(q) {
            return {
                id: q.id, path: q.path,
                question: q['Frage'] ?? q.question,
                options: q.options ?? Object.fromEntries(letters.map(letter => [letter, q[`Antwortoption ${letter}`]])),
                correct: Array.isArray(q.correct) ? q.correct.join(',') : q['Korrekte-Antwort'] ?? q.correct
            };
        }

        /* DOKU: Prüft die für diese Darstellung benötigten Frage- und Antwortfelder. Ungültige Datensätze werden beim Laden herausgefiltert. */
function valid(q) {
            const answers = String(q.correct || '').split(',').map(value => value.trim()).filter(Boolean);
            return Boolean(q.question) && answers.length > 0 &&
                new Set(answers).size === answers.length && answers.every(letter => letters.includes(letter)) &&
                letters.every(letter => typeof q.options?.[letter] === 'string' && q.options[letter]);
        }

        /* DOKU: Mischt eine Array-Kopie mit Fisher-Yates. Die Ausgangsliste bleibt erhalten; ein Neustart mischt die bereits gebildete Runde erneut. */
function shuffle(items) {
            const result = [...items];
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        // ============================================================
        // KARTE ANZEIGEN
        // Vorderseite: nur Frage. Rückseite: nur korrekte Antworttexte.
        // Die kleinen Wörter "Klick" und "Antwort" kommen von hier.
        // ============================================================
        /* DOKU: Stellt die aktuelle Frage dar und setzt nur die Bedienelemente für diesen Frageschritt zurück. */
function render() {
            const q = round[index];
            flipped = false;
            $('card').classList.remove('is-back');
            $('card-side').textContent = 'Klick';
            $('card-content').replaceChildren();
            const text = document.createElement('p');
            text.textContent = q.question;
            $('card-content').append(text);
            $('previous').disabled = index === 0;
            $('next').disabled = !completed.has(q.id);
            $('next').textContent = index === round.length - 1 ? 'Beenden' : 'Weiter';
            updateProgress();
        }

        /* DOKU: Ersetzt die Frage durch die korrekten Antworttexte. Die Zählung der Ansicht findet im Klickhandler vor diesem Aufruf statt. */
function showBack() {
            const q = round[index];
            flipped = true;
            $('card').classList.add('is-back');
            $('card-side').textContent = 'Antwort';
            $('card-content').replaceChildren();
            const correct = String(q.correct).split(',').map(value => value.trim());
            for (const letter of correct) {
                const text = document.createElement('p');
                text.textContent = q.options[letter];
                $('card-content').append(text);
            }
        }

        // ============================================================
        // FORTSCHRITT UND DURCHLAUF
        // "Karten:" und die Zählertexte lassen sich hier ändern.
        // Bereits gelernte Karten werden beim Neustart neu gemischt.
        // ============================================================
        /* DOKU: completed zählt eindeutig aufgedeckte Karten dieses Durchlaufs. Navigation zurück zu einer bekannten Karte erhöht den Fortschritt nicht nochmals. */
function updateProgress() {
            $('total').textContent = `Karten: ${round.length}`;
            $('count').textContent = `${completed.size} / ${round.length}`;
            $('progress').max = round.length;
            $('progress').value = completed.size;
        }

        /* DOKU: Setzt den Durchlauf zurück. Beim ersten Start wird die geladene Auswahl begrenzt; all umgeht die sonstige Grenze von 40. Bei Neustarts wird die bestehende Runde neu gemischt. */
function start() {
            const count = selection.questionCount === 'all'
                ? all.length
                : Math.min(selection.questionCount || 15, 40, all.length);
            round = round.length ? shuffle(round) : shuffle(all).slice(0, count);
            index = 0;
            completed = new Set();
            $('result').classList.add('hidden');
            $('play').classList.remove('hidden');
            window.scrollTo({top:0,left:0,behavior:'instant'});
            $('status').classList.add('hidden');
            render();
        }

        // ============================================================
        // ANMELDUNG UND FRAGEN LADEN
        // Auch "Alle Semester/Fächer/Themen" wird berücksichtigt.
        // ============================================================
        /* DOKU: Lädt die Fragen erst für das freigegebene Konto. Die UID-Prüfung kommt aus private-auth.js; Firestore muss Zugriffe zusätzlich serverseitig erlauben. queueAnswer sichert Antworten lokal vor dem zeitversetzten Cloud-Abgleich. */
onAuthStateChanged(auth, async current => {
            if (!current) {
        clearDataCache();
                location.replace('login.html');
                return;
            }
            if (user?.uid === current.uid) return;
    user = current;
            if (!validSelection) return;
            try {
                const questions = await loadRoundQuestions(db, user.uid, selection);
                all = questions.map(normalize).filter(valid);
                if (!all.length) {
                    $('status').textContent = 'Für diese Auswahl sind noch keine Flashcards vorhanden.';
                    $('status').classList.add('error');
                    return;
                }
                start();
            } catch (error) {
                console.error(error);
                $('status').textContent = 'Karten konnten nicht geladen werden. Prüfe Anmeldung und Verbindung.';
                $('status').classList.add('error');
            }
        });

        // ============================================================
        // KARTE UMDREHEN UND GESICHTETE KARTEN SPEICHERN
        // Es gibt absichtlich keine Punkte und keine Benotung.
        // ============================================================
        $('card').addEventListener('click', async () => {
            if (!user || busy) return;
            const q = round[index];
            if (flipped) {
                render();
                return;
            }
            if (!completed.has(q.id)) {
                busy = true;
                try {
                    await queueAnswer(db, user.uid, q, {viewed: true, type: 'FC'});
                    completed.add(q.id);
                    $('next').disabled = false;
                    updateProgress();
                } catch (error) {
                    console.error(error);
                    $('status').textContent = 'Speichern fehlgeschlagen. Bitte Karte erneut anklicken.';
                    $('status').classList.remove('hidden');
                    $('status').classList.add('error');
                    busy = false;
                    return;
                }
                busy = false;
            }
            $('status').classList.add('hidden');
            showBack();
        });

        // ============================================================
        // NAVIGATION: Vorherige, Weiter, Mischen, Beenden
        // ============================================================
        $('previous').addEventListener('click', () => {
            if (index > 0) {
                index--;
                render();
            }
        });

        $('next').addEventListener('click', () => {
            if (!completed.has(round[index].id)) return;
            if (index < round.length - 1) {
                index++;
                render();
            } else {
                $('play').classList.add('hidden');
                $('result').classList.remove('hidden');
                window.scrollTo({top:0,left:0,behavior:'instant'});
                $('summary').textContent = `${completed.size} Karten gelernt`;
            }
        });

        $('restart').addEventListener('click', start);

        // Der Slider ändert nur diese CSS-Variable auf der Karte.
        $('font-size').addEventListener('input', event => {
            $('card').style.setProperty('--card-size', `${1.05 + Number(event.target.value) * 0.15}rem`);
        });
    </script>
</body>
</html>
